# pr-agent (OSS) caller — adopts the wave-foundation reusable lane.
# Engine: OSS Qodo Merge on our OPENAI_KEY (trial-independent). SSOT pinned by SHA.
name: pr-agent (OSS)
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write
  contents: read

concurrency:
  group: pr-agent-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr_agent:
    uses: wave-av/wave-foundation/.github/workflows/reusable-pr-agent.yml@4ac59c8c9f97d2e900e2d34605c0092ca7ebb0fc # post-#1191
    secrets:
      OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
